version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tools-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tools_user
      POSTGRES_PASSWORD: tools_password
      POSTGRES_DB: tools_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools_user -d tools_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: tools-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://tools_user:tools_password@postgres:5432/tools_db?schema=public
      - JWT_SECRET=super_secret_jwt_key_that_is_at_least_thirty_two_chars_long
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_that_is_at_least_thirty_two_chars_long
      - CLIENT_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: tools-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - api
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data:
