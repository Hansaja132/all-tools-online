services:
  api:
    environment:
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma db push --schema=database/prisma/schema.prisma && npm run dev --workspace=@tools-website/api"

  web:
    environment:
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev --workspace=@tools-website/web
